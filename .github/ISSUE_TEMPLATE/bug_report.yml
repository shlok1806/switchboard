name: Bug report
description: Something in Switchboard does not work as documented.
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Tell us what you saw. Include error messages and screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. switchboard run claude
        2. ...
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - CLI (switchboard run / host)
        - Dashboard
        - Worker / Channel
        - Install
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent CLI
      multiple: true
      options:
        - Claude Code
        - Codex
        - Cursor CLI
        - Gemini CLI
        - Not applicable
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node.js version (`node -v`), agent CLI version, and the commit of Switchboard you run (`git -C ~/.switchboard/src rev-parse --short HEAD`).
    validations:
      required: true
  - type: markdown
    attributes:
      value: Remove tokens, keys and other secrets from logs before you paste them. Report security problems privately, not here.
