name: Feature request
description: Suggest a new feature or a change to how Switchboard works.
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you try to do, and what stops you now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Switchboard do? Use the terms in CONTEXT.md where you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve the problem that you thought about.
