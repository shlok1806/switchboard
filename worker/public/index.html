<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Switchboard</title>
<!-- A stopgap view of the Channel until the Dashboard (#17) replaces it. One file, no framework. -->
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f5f4;
    --border: #e4e4e2;
    --text: #1c1c1a;
    --muted: #6b6b66;
    --accent: #2f5bd3;
    --accent-text: #ffffff;
    --danger: #c0392b;
    --ok: #1f9d55;
    --idle: #b7791f;
    --l: 34%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1f1f1d;
      --border: #2e2e2b;
      --text: #ececea;
      --muted: #9a9a94;
      --accent: #7b9cff;
      --accent-text: #0d0d0c;
      --danger: #ff7b6b;
      --ok: #4cc38a;
      --idle: #e0a84a;
      --l: 72%;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); }
  .spacer { flex: 1; }
  .me { color: var(--muted); font-size: 13px; }
  button.link {
    background: none; border: 0; padding: 0; color: var(--accent);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  main:not([hidden]) { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  main > .wrap { margin-top: auto; width: 100%; }
  #events { list-style: none; margin: 0; padding: 12px 0; }
  #events li { padding: 6px 0; overflow-wrap: anywhere; }
  .meta { display: flex; align-items: baseline; gap: 8px; }
  .who { font-weight: 600; flex-shrink: 0; }
  .time { flex-shrink: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .text { white-space: pre-wrap; }
  li.quiet { color: var(--muted); font-size: 13px; }
  li.quiet .who { font-weight: 500; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  footer {
    border-top: 1px solid var(--border);
    padding: 12px 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  form.post { display: flex; gap: 8px; }
  input, button.primary {
    font: inherit;
    font-size: 16px;
    border-radius: 8px;
    min-height: 44px;
  }
  input {
    flex: 1;
    min-width: 0;
    padding: 0 12px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary {
    padding: 0 16px;
    border: 0;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  .error { color: var(--danger); font-size: 13px; margin: 8px 0 0; min-height: 1em; }
  #join-view:not([hidden]) { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  form.join { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  form.join h2 { margin: 0 0 4px; font-size: 20px; }
  form.join p { margin: 0 0 8px; color: var(--muted); }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  #tasks-bar { border-bottom: 1px solid var(--border); }
  details.tasks { width: 100%; padding-top: 8px; padding-bottom: 8px; }
  details.tasks summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
  details.tasks summary .count { color: var(--muted); font-weight: 400; }
  #tasks { list-style: none; margin: 0; padding: 0; max-height: 40dvh; overflow-y: auto; }
  #tasks li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 6px 0; font-size: 14px; }
  #tasks li.sub { padding-left: 20px; }
  #tasks .num { color: var(--muted); font-variant-numeric: tabular-nums; text-decoration: none; }
  #tasks .title { flex: 1 1 12em; min-width: 0; overflow-wrap: anywhere; }
  #tasks li.done .title { color: var(--muted); text-decoration: line-through; }
  #tasks .facts { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; }
  #tasks .blocked { color: var(--danger); }
  .bar { display: inline-block; width: 40px; height: 4px; border-radius: 2px; background: var(--border); vertical-align: middle; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--ok); }
  #agents-bar { border-bottom: 1px solid var(--border); padding: 8px 0; }
  #agents { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; }
  #agents li { display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; }
  #agents .dot.idle { background: var(--idle); }
  #agents li.gone { color: var(--muted); }
  #agents .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
  #agents .nick { color: var(--muted); }
  #agents .presence { color: var(--muted); font-size: 12px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Switchboard</h1>
  <span class="status" id="status" hidden><span class="dot" id="dot"></span><span id="status-text"></span></span>
  <span class="spacer"></span>
  <span class="me" id="me" hidden></span>
  <button class="link" id="leave" type="button" hidden>Leave</button>
</header>

<div id="join-view">
  <form class="join" id="join-form">
    <h2>Join the Channel</h2>
    <p>Everyone on the Channel sees every Event.</p>
    <label>Join secret
      <input id="secret" type="password" autocomplete="current-password" required>
    </label>
    <label>Your name
      <input id="name" autocomplete="nickname" autocapitalize="none" spellcheck="false" maxlength="32" required>
    </label>
    <button class="primary" type="submit">Join</button>
    <p class="error" id="join-error" role="alert"></p>
  </form>
</div>

<section id="agents-bar" aria-label="Agents" hidden>
  <div class="wrap"><ul id="agents"></ul></div>
</section>

<div id="tasks-bar" hidden>
  <details class="wrap tasks" open>
    <summary>Tasks <span class="count" id="tasks-count"></span></summary>
    <ul id="tasks"></ul>
  </details>
</div>

<main id="channel-view" hidden>
  <div class="wrap">
    <ol id="events" aria-live="polite"></ol>
    <p class="empty" id="empty" hidden>No Events yet. Post the first Update.</p>
  </div>
</main>
<footer id="composer" hidden>
  <div class="wrap">
    <form class="post" id="post-form">
      <input id="update" placeholder="Post an Update" autocomplete="off" maxlength="4000" aria-label="Update">
      <button class="primary" id="post" type="submit">Post</button>
    </form>
    <p class="error" id="post-error" role="alert"></p>
  </div>
</footer>

<script>
"use strict";
const STORE_KEY = "switchboard.credentials";
const $ = (id) => document.getElementById(id);
let creds = null;
let lastSeq = 0;
let socket = null;
let retry = 0;
let session = 0;
const tasks = new Map();

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; }
}
function save(value) {
  try {
    if (value) localStorage.setItem(STORE_KEY, JSON.stringify(value));
    else localStorage.removeItem(STORE_KEY);
  } catch { /* Private mode or blocked storage: stay signed in for this tab only. */ }
}

async function api(path, init = {}) {
  const res = await fetch(path, {
    ...init,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${creds.secret}`,
      "X-Switchboard-Person": creds.person,
    },
  });
  const body = await res.json().catch(() => ({ ok: false, reason: res.statusText }));
  if (!res.ok) throw Object.assign(new Error(body.reason || `HTTP ${res.status}`), { status: res.status });
  return body;
}

function hue(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % 360;
}
function actorName(actor) {
  return actor.kind === "person" ? actor.person : actor.kind === "agent" ? actor.agentId : "github";
}

const PRESENCE = { live: "Live", idle: "Idle", gone: "Gone" };
const agents = new Map();

function showAgent(agent) {
  agents.set(agent.id, agent);
  renderAgents();
}

/** The Agents on the Channel with their Presence: Live first, then Idle, then Gone. */
function renderAgents() {
  const order = { live: 0, idle: 1, gone: 2 };
  const list = [...agents.values()].sort((a, b) =>
    order[a.presence] - order[b.presence] || a.id.localeCompare(b.id));
  const items = list.map((agent) => {
    const li = document.createElement("li");
    li.className = agent.presence;
    li.title = `${agent.person}'s ${agent.cli} session, last seen ${new Date(agent.lastSeenAt).toLocaleString()}`;
    const dot = document.createElement("span");
    dot.className = `dot ${agent.presence}`;
    const id = document.createElement("span");
    id.className = "id";
    id.textContent = agent.id;
    const presence = document.createElement("span");
    presence.className = "presence";
    presence.textContent = PRESENCE[agent.presence] || agent.presence;
    li.append(dot, id);
    if (agent.nickname) {
      const nick = document.createElement("span");
      nick.className = "nick";
      nick.textContent = agent.nickname;
      li.append(nick);
    }
    li.append(presence);
    return li;
  });
  $("agents").replaceChildren(...items);
  $("agents-bar").hidden = !creds || list.length === 0;
}

function render(event) {
  if (event.seq <= lastSeq) return;
  lastSeq = event.seq;
  const main = $("channel-view");
  const pinned = main.scrollHeight - main.scrollTop - main.clientHeight < 80;

  const li = document.createElement("li");
  const meta = document.createElement("div");
  meta.className = "meta";
  const who = document.createElement("span");
  who.className = "who";
  const name = actorName(event.actor);
  who.textContent = name;
  who.style.color = `hsl(${hue(name)} 55% var(--l))`;
  const time = document.createElement("time");
  time.className = "time";
  time.dateTime = event.at;
  const at = new Date(event.at);
  time.textContent = at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  time.title = at.toLocaleString();
  meta.append(who, time);

  if (event.type === "update") {
    const text = document.createElement("div");
    text.className = "text";
    text.textContent = event.payload.text;
    li.append(meta, text);
  } else {
    li.className = "quiet";
    const what = document.createElement("span");
    what.textContent = describe(event);
    meta.insertBefore(what, time);
    li.append(meta);
  }
  $("events").append(li);
  $("empty").hidden = true;
  if (pinned) main.scrollTop = main.scrollHeight;
}

function describe(event) {
  const n = `Task #${event.task}`;
  switch (event.type) {
    case "person.join": return "joined the Channel";
    case "task.create": return `created ${n}: ${event.payload.title}`;
    case "task.change": return `changed ${event.payload.fields.join(", ")} on ${n}`;
    case "task.done": return `closed ${n}`;
    case "task.reopen": return `reopened ${n}`;
    case "task.remove": return `removed ${n}`;
    case "session.start":
      if (event.capture === "hook") return `reported session start (${event.payload.source || "startup"})`;
      return event.payload.resumed ? "resumed its session" : "started a session";
    case "session.end":
      if (event.capture === "hook") return `reported session end${event.payload.detail ? ` (${event.payload.detail})` : ""}`;
      return "ended its session";
    case "presence": return `is ${PRESENCE[event.payload.presence] || event.payload.presence}`;
    case "tool.call": return `used ${event.payload.tool}${event.payload.arg ? `: ${event.payload.arg}` : ""}`;
    case "file.edit": return `edited ${event.payload.path} (+${event.payload.additions} -${event.payload.deletions})`;
    case "command": return `ran ${event.payload.command}`;
    case "turn.end": return `finished turn ${event.payload.turn}`;
    default: return event.type;
  }
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function progress(done, total, noun) {
  const span = el("span");
  const bar = el("span", "bar");
  const fill = el("span");
  fill.style.width = `${total ? (100 * done) / total : 0}%`;
  bar.append(fill);
  span.append(bar, ` ${done}/${total} ${noun}`);
  return span;
}

function taskRow(task, isSub) {
  const li = el("li", [isSub ? "sub" : "", task.status === "done" ? "done" : ""].join(" ").trim());
  const num = el("a", "num", `#${task.number}`);
  num.href = task.url;
  num.target = "_blank";
  num.rel = "noopener";
  const facts = el("span", "facts");
  if (task.steps.length) facts.append(progress(task.stepsDone, task.steps.length, "steps"));
  if (task.subtasks.length) facts.append(progress(task.subtasksDone, task.subtasks.length, "subtasks"));
  if (task.blockedBy.length) facts.append(el("span", "blocked", `blocked by ${task.blockedBy.map((b) => `#${b}`).join(", ")}`));
  if (task.status !== "open") facts.append(el("span", "", task.status));
  li.append(num, el("span", "title", task.title), facts);
  return li;
}

function renderTasks() {
  const list = $("tasks");
  list.textContent = "";
  const all = [...tasks.values()].sort((a, b) => a.number - b.number);
  const children = (parent) => all.filter((t) => t.parent === parent.number);
  for (const task of all) {
    if (task.parent !== undefined && tasks.has(task.parent)) continue;
    list.append(taskRow(task, false));
    for (const sub of children(task)) list.append(taskRow(sub, true));
  }
  const open = all.filter((t) => t.status !== "done").length;
  $("tasks-count").textContent = `${open} open`;
  $("tasks-bar").hidden = !creds || all.length === 0;
}

async function loadTasks(mine) {
  try {
    const page = await api("/api/tasks");
    if (mine !== session) return;
    for (const task of page.tasks) tasks.set(task.number, task);
  } catch {
    // Task sync not configured, or GitHub unreachable: the Channel still works without it.
  }
  renderTasks();
}

function setStatus(live, text) {
  $("dot").classList.toggle("live", live);
  $("status-text").textContent = text;
}

function connect(mine) {
  if (mine !== session) return;
  const url = new URL("/api/stream", location.href);
  url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  url.searchParams.set("after", String(lastSeq));
  url.searchParams.set("person", creds.person);
  url.searchParams.set("secret", creds.secret);
  const ws = new WebSocket(url);
  socket = ws;
  let keepalive;
  ws.onopen = () => {
    retry = 0;
    setStatus(true, "Live");
    keepalive = setInterval(() => ws.send("ping"), 30000);
  };
  ws.onmessage = (e) => {
    if (e.data === "pong") return;
    const message = JSON.parse(e.data);
    if (message.type === "event") {
      render(message.event);
      if (message.event.type === "task.remove" && tasks.delete(message.event.task)) renderTasks();
    } else if (message.type === "task") {
      tasks.set(message.task.number, message.task);
      renderTasks();
    } else if (message.type === "agent") {
      showAgent(message.agent);
    }
  };
  ws.onclose = () => {
    clearInterval(keepalive);
    if (mine !== session) return;
    retry += 1;
    setStatus(false, "Reconnecting");
    setTimeout(() => connect(mine), Math.min(10000, 500 * 2 ** retry));
  };
}

function show(joined) {
  if (!joined) $("tasks-bar").hidden = true;
  $("join-view").hidden = joined;
  $("channel-view").hidden = !joined;
  $("composer").hidden = !joined;
  $("status").hidden = !joined;
  $("me").hidden = !joined;
  $("leave").hidden = !joined;
  $("agents-bar").hidden = !joined || agents.size === 0;
}

async function enter(candidate) {
  creds = candidate;
  $("join-error").textContent = "";
  try {
    const { person } = await api("/api/join", {
      method: "POST",
      body: JSON.stringify({ timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }),
    });
    creds = { secret: candidate.secret, person: person.name };
    save(creds);
  } catch (err) {
    creds = null;
    if (err.status === 401 || err.status === 400) save(null);
    $("join-error").textContent = err.message;
    show(false);
    return;
  }
  session += 1;
  const mine = session;
  lastSeq = 0;
  $("events").textContent = "";
  tasks.clear();
  renderTasks();
  agents.clear();
  renderAgents();
  api("/api/agents").then((body) => {
    if (mine === session) body.agents.forEach(showAgent);
  }, () => { /* The stream sends the roster too. */ });
  $("me").textContent = creds.person;
  setStatus(false, "Connecting");
  show(true);

  try {
    for (;;) {
      const page = await api(`/api/events?after=${lastSeq}`);
      if (mine !== session) return;
      if (page.events.length === 0) break;
      page.events.forEach(render);
    }
  } catch (err) {
    $("post-error").textContent = `Could not load history: ${err.message}`;
  }
  $("empty").hidden = lastSeq > 0;
  await loadTasks(mine);
  if (mine !== session) return;
  const main = $("channel-view");
  main.scrollTop = main.scrollHeight;
  connect(mine);
  $("update").focus();
}

$("join-form").addEventListener("submit", (e) => {
  e.preventDefault();
  enter({ secret: $("secret").value, person: $("name").value });
});

$("post-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("update");
  const text = input.value.trim();
  if (!text) return;
  $("post").disabled = true;
  $("post-error").textContent = "";
  try {
    await api("/api/updates", { method: "POST", body: JSON.stringify({ text }) });
    input.value = "";
  } catch (err) {
    $("post-error").textContent = `Could not post: ${err.message}`;
  } finally {
    $("post").disabled = false;
    input.focus();
  }
});

$("leave").addEventListener("click", () => {
  session += 1;
  socket?.close();
  save(null);
  creds = null;
  $("secret").value = "";
  show(false);
});

const saved = load();
if (saved && typeof saved.secret === "string" && typeof saved.person === "string") {
  $("name").value = saved.person;
  enter(saved);
}
</script>
</body>
</html>
